[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bronson"
version = "0.3.0"
description = "A terminal UI for GitHub Actions and read-only GitLab CI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["textual>=8.2.0", "rich>=14.0.0", "watchfiles>=1.0"]

[project.urls]
Homepage = "https://github.com/mitander/bronson"
Repository = "https://github.com/mitander/bronson"

[project.scripts]
bronson = "bronson.cli:main"

[tool.setuptools.packages.find]
include = ["bronson", "bronson.*"]
